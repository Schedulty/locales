name: Translation error
description: A wrong, unclear or missing text
labels: [translation]
body:
  - type: input
    id: locale
    attributes:
      label: Language
      placeholder: ru_RU
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: Key or the text you saw
      placeholder: bot.commands.schedule.empty
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What it should say
    validations:
      required: true
